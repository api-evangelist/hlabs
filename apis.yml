name: Hlabs
description: >-
  Hlabs (Harrison Laboratories, Inc., operating as hlaboratories.com) is a
  US-based, Y Combinator-backed (Winter 2026) manufacturer of plug-and-play
  robotics components. The company produces a domestically-manufactured,
  integrated hardware ecosystem for robot builders — including the RB1 main
  board (powered by Nvidia Jetson), wireless communication modules,
  field-oriented control (FOC) boards, pancake motors, and actuators. Its stated
  goal is to eliminate the complexity of sourcing mismatched components from
  overseas and integrating them, so roboticists can focus on design rather than
  electronics debugging. Hlabs targets teams building medium-to-large robots such
  as quadrupeds, humanoids, and robot arms, and serves customers across household
  robotics, defense, and other robotic platforms. This is a hardware manufacturer
  with no public developer/API surface at the time of profiling.
